name: backend-ci-cd
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw
      - name: Build and Package Jar
        env:
          DB_URL: jdbc:mysql://localhost:3306/unimart
          DB_USERNAME: root
          DB_PASSWORD: password
          JWT_SECRET: dGhpcyBpcyBhIHZlcnkgbG9uZyBhbmQgc2VjdXJlIHNlY3JldCBrZXkgZm9yIHVuaW1hcnQ=
          APP_ALLOWED_ORIGINS: http://localhost:5173
        run: ./mvnw -B clean package -DskipTests
      - name: Set lower case repository owner
        id: repo_owner
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/unimart-backend:latest
            ghcr.io/${{ steps.repo_owner.outputs.owner }}/unimart-backend:${{ github.sha }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DO_HOST != ''
    needs: test-build-publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DO_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy backend
        run: |
          ssh "${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}" \
            'cd /opt/unimart && docker compose pull backend && \
             docker compose up -d backend && docker image prune -f'
